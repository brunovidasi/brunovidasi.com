  <style>
    /* ===================================================================
       COLOUR TOKENS
       Light mode = white bg / #333 text. Dark mode = #333 bg / white text.
       --accent (#0077bb) stays the same in both modes.
    =================================================================== */
    :root {
      --bg: #FFFFFF;
      --text: #333333;
      --muted: rgba(51, 51, 51, 0.6);
      --accent: #0077bb;
      --button-text: #FFFFFF;
      --button-ring: rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #333333;
        --text: #FFFFFF;
        --muted: rgba(255, 255, 255, 0.6);
        --button-ring: rgba(255, 255, 255, 0.12);
      }
    }

    /* ===================================================================
       BASE
    =================================================================== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* centers the whole page, one item under the other */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 460px;
      padding: 48px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ===================================================================
       PROFILE PHOTO
       Replace "profile.jpg" below with your own photo file
       (same folder as this html). Until then, initials show instead.
    =================================================================== */
    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      margin-bottom: 18px;
      border: 3px solid #FFFFFF;
    }

    .avatar-fallback {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      margin-bottom: 18px;
    }

    /* ===================================================================
       TITLE
    =================================================================== */
    h1 {
      margin: 0 0 6px;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      margin: 0 0 0px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--muted);
    }

    /* ===================================================================
       LINKS LIST
    =================================================================== */
    .category-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    .category-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      padding-top: 15px;
    }

    .category-arrow {
      padding-right: 10px;
      color: var(--muted);

      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      line-height: 1;
      transition: transform 0.2s ease;
      transform-origin: center;
    }

    .category-title {
      width: 100%;
      text-align: left;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 10px 0 8px;
      color: var(--muted);
    }

    .link-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      color: var(--button-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 0 0 1px var(--button-ring), 0 2px 6px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .link-item .icon {
      position: absolute;
      left: 18px;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .link-item .label {
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .link-item:active {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .link-item:hover {
        transform: translateY(-2px);
        filter: brightness(1.06);
      }
    }

    /* ===================================================================
       FOOTER
    =================================================================== */
    footer {
      margin-top: 36px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <div class="page">

    <!-- Profile photo: drop a "profile.jpg" file next to this html file
         to use your own photo. Until then, initials are shown instead. -->
    <img
      class="avatar"
      id="avatar"
      src="profile.jpg"
      alt="Bruno Vieira"
      onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'avatar-fallback', id:'avatar', textContent:'BV'}))"
    >

    <h1>Bruno Vieira</h1>
    <p class="subtitle">FOLLOW &middot; ADD &middot; CONTACT</p>

    <nav class="links" id="links"></nav>

    <footer>
      @brunovidasi &middot; <a href="https://brunovida.si/">brunovida.si</a>
    </footer>

  </div>

  <script>
    /* =====================================================================
       LINKS — edit this list to add, remove or reorder buttons.
       icon  : must match a <symbol id="icon-..."> defined above
       color : any CSS background value (hex, or a gradient string)
               omit it (or use "default") to fall back to the accent colour
    ===================================================================== */
    const DEFAULT_COLOR = 'var(--accent)';

    const links = [
      
      { category: 'Social', name: 'Instagram', url: 'https://instagram.com/brunovidasi', icon: 'instagram', color: 'linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888)' },
      { category: 'Social', name: 'Facebook', url: 'https://facebook.com/brunovidasi', icon: 'facebook', color: '#1877F2' },
      { category: 'Social', name: 'TikTok', url: 'https://tiktok.com/@brunovidasi', icon: 'tiktok', color: '#000000' },
      { category: 'Social', name: 'X', url: 'https://x.com/brunovidasi', icon: 'x', color: '#000000' },
      { category: 'Social', name: 'Pinterest', url: 'https://pinterest.com.au/brunovidasi', icon: 'pinterest', color: '#E60023' },
      { category: 'Social', name: 'Youtube', url: 'https://youtube.com/brunices', icon: 'youtube', color: '#FF0000' },

      { category: 'Professional', name: 'Website', url: 'https://brunovida.si/', icon: 'website', color: DEFAULT_COLOR },
      { category: 'Professional', name: 'Resume', url: 'https://brunovida.si/resume/', icon: 'resume', color: DEFAULT_COLOR },
      { category: 'Professional', name: 'Email me', url: 'mailto:contact@brunovidasi.com', icon: 'email', color: DEFAULT_COLOR },
      { category: 'Professional', name: 'LinkedIn', url: 'https://linkedin.com/in/brunovidasi', icon: 'linkedin', color: '#0A66C2' },
      { category: 'Professional', name: 'GitHub', url: 'https://github.com/brunovidasi', icon: 'github', color: '#181717' },
      { category: 'Professional', name: 'CodePen', url: 'https://codepen.io/brunovidasi', icon: 'codepen', color: '#000000' },

      { category: 'Chat', name: 'Whatsapp', url: 'https://wa.me/61473216970', icon: 'whatsapp', color: '#25D366' },
      { category: 'Chat', name: 'Telegram', url: 'https://t.me/brunovidasi', icon: 'telegram', color: '#26A5E4' },
      { category: 'Chat', name: 'Messenger', url: 'https://messenger.com/t/brunovidasi', icon: 'messenger', color: 'linear-gradient(135deg, #00B2FF, #006AFF, #B620E0)' },


      { category: 'Gaming', name: 'PlayStation', url: 'https://psnprofiles.com/bvidasi', icon: 'playstation', color: '#003791' },
      { category: 'Gaming', name: 'Nintendo Switch', url: 'https://lounge.nintendo.com/friendcode/0941-9916-2497/CwbBTf2PGB', icon: 'nintendoswitch', color: '#E60012' },
      { category: 'Gaming', name: 'Xbox', url: 'https://www.xbox.com/en-AU/play/user?gamerTag=brunovidasi', icon: 'xbox', color: '#107C10' },

      { category: 'Other', name: 'Discogs', url: 'https://www.discogs.com/user/brunovidasi', icon: 'discogs', color: '#000000' },
    ];

    // Render the buttons into the page
    const container = document.getElementById('links');

    let currentCategory = '';

    links.forEach(link => {

      if (link.category !== currentCategory) {
        currentCategory = link.category;

        const header = document.createElement('div');
        header.className = 'category-header';

        const title = document.createElement('h2');
        title.className = 'category-title';
        title.textContent = currentCategory;

        const arrow = document.createElement('span');
        arrow.className = 'category-arrow';
        arrow.textContent = '▼';

        header.appendChild(arrow);
        header.appendChild(title);
        

        const section = document.createElement('div');
        section.className = 'category-links';

        header.onclick = () => {
          const closed = section.style.display === 'none';
          section.style.display = closed ? 'flex' : 'none';
          arrow.textContent = '▶';
          arrow.textContent = closed ? '▼' : '▶';
        };

        container.appendChild(header);
        container.appendChild(section);
      }

      const a = document.createElement('a');
      a.className = 'link-item';
      a.href = link.url;
      a.style.background = link.color || DEFAULT_COLOR;

      // open real links in a new tab, but not mailto: links
      if (!link.url.startsWith('mailto:')) {
        a.target = '_blank';
        a.rel = 'noopener';
      }

      a.innerHTML = `
        <svg class="icon" aria-hidden="true"><use href="#icon-${link.icon}"></use></svg>
        <span class="label">${link.name}</span>
      `;

      const section = container.lastElementChild;
      section.appendChild(a);
    });
  </script>
