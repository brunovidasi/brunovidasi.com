<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- an arcade joystick: red ball top, two buttons, on a blue box -->
  <defs><clipPath id="ball"><circle cx="16" cy="7.6" r="5.6"/></clipPath></defs>
  <g stroke="#111216" stroke-width="1.2" stroke-linejoin="round">
    <!-- the box: its front, then its top rim and the dark plate inside it -->
    <rect x="2.6" y="20" width="26.8" height="9.4" rx="2.4" fill="#2f4cb3"/>
    <path d="M6.4 12.8 H25.6 L29.4 22.6 H2.6 Z" fill="#4d8dff"/>
    <path d="M8.4 15 H23.6 L26.2 20.8 H5.8 Z" fill="#2a2f4a"/>
  </g>
  <g stroke="#111216" stroke-width="1" stroke-linejoin="round">
    <!-- the buttons -->
    <path d="M6.3 18.3 v1.2 a2.4 1.2 0 0 0 4.8 0 v-1.2" fill="#b81f28"/>
    <ellipse cx="8.7" cy="18.3" rx="2.4" ry="1.2" fill="#ff4a52"/>
    <path d="M20.9 18.3 v1.2 a2.4 1.2 0 0 0 4.8 0 v-1.2" fill="#d69b12"/>
    <ellipse cx="23.3" cy="18.3" rx="2.4" ry="1.2" fill="#ffd23f"/>
  </g>
  <g stroke="#111216" stroke-width="1.2" stroke-linejoin="round">
    <!-- the stick in its socket -->
    <ellipse cx="16" cy="19" rx="3.4" ry="1.3" fill="#c9cad3"/>
    <rect x="14.6" y="8" width="2.8" height="11.4" rx="1.4" fill="#f4f4f7"/>
  </g>
  <!-- the ball: shaded at the lower right, with a glint -->
  <circle cx="16" cy="7.6" r="5.6" fill="#b81f28"/>
  <circle cx="15" cy="6.6" r="5.2" fill="#e8303a" clip-path="url(#ball)"/>
  <ellipse cx="13.6" cy="5.2" rx="1.5" ry=".95" fill="#fff" opacity=".6" transform="rotate(-35 13.6 5.2)"/>
  <circle cx="16" cy="7.6" r="5.6" fill="none" stroke="#111216" stroke-width="1.2"/>
</svg>
