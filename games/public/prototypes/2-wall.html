<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Shelf — Display Wall</title>
<link rel="stylesheet" href="../assets/ui.css">
<link rel="stylesheet" href="../assets/cases.css">
<style>
  /* A gallery wall: every case face-out on its own little acrylic stand, at its real size. */
  body { background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,210,150,.07), transparent),
    radial-gradient(ellipse 60% 40% at 80% 70%, rgba(255,210,150,.06), transparent),
    repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    #17130f; background-attachment: fixed; }
  .tools { max-width: var(--page); margin: 18px auto 0; padding: 0 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .tools > span { opacity: .55; }
  .wall { max-width: var(--page); margin: 0 auto 100px; padding: 0 20px; }
  .sec { margin-top: 44px; }
  .sec h3 { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font: 600 26px 'Fraunces', serif; }
  .sec h3 .mini { width: calc(var(--mw) * 1px); height: calc(var(--mh) * 1px); border-radius: 2px; background: var(--mp); position: relative; overflow: hidden; }
  .sec h3 .mini::before { content: ""; position: absolute; inset: 0 0 auto; height: 22%; background: var(--mb); }
  .sec h3 small { font: 500 12px 'Space Grotesk', sans-serif; opacity: .5; letter-spacing: .1em; text-transform: uppercase; }
  .sec h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--fc), transparent); opacity: .5; }
  .grid { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 34px 26px; }

  .tile { position: relative; border: 0; padding: 0 0 14px; background: none; cursor: pointer; perspective: 700px; outline: none; }
  .tile .tilt { transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.8,.2,1); will-change: transform; }
  .tile:hover .tilt { transition: transform .12s linear; }
  .tile .cv { box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 14px 26px -6px rgba(0,0,0,.65); transition: box-shadow .3s; }
  .tile:hover .cv, .tile:focus-visible .cv { box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 50px -10px rgba(0,0,0,.8); }
  .tile:focus-visible .cv { outline: 2px solid var(--gold); outline-offset: 3px; }
  .tile .cv .gl { background: radial-gradient(circle at var(--gx, 30%) var(--gy, 20%), rgba(255,255,255,.35), rgba(255,255,255,0) 45%), linear-gradient(115deg, rgba(255,255,255,.12), transparent 40%); opacity: .7; transition: opacity .3s; }
  .tile:hover .cv .gl { opacity: 1; }
  /* acrylic stand */
  .tile::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 0; height: 14px; border-radius: 0 0 4px 4px;
    background: linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.18); border-top: 0; }
  .tile .meta { position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; text-align: center; font-size: 11px; opacity: 0; transform: translateY(-4px); transition: .25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .tile:hover .meta { opacity: .7; transform: none; }
  .tile .dot { position: absolute; z-index: 6; top: -6px; right: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid #17130f; transform: translateZ(30px); }
  .tile.enter { animation: rise .55s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } }
</style>
</head>
<body>
<div id="shell"></div>
<div class="tools">
  <span>Size</span>
  <div class="pills" id="size"><button data-z="true" class="on">True to life</button><button data-z="even">Same height</button></div>
  <span style="margin-left:10px">Status dots</span>
  <div class="pills" id="dots"><button data-d="1">On</button><button data-d="0" class="on">Off</button></div>
</div>
<div class="wall" id="wall"></div>

<script src="../assets/data.js"></script>
<script src="../assets/cases.js"></script>
<script src="../assets/ui.js"></script>
<script>
  const wall = document.getElementById('wall');
  let games = [], size = 'true', dots = false;
  const famColor = Object.fromEntries(FAMILIES.map(f => [f.id, f.color]));

  function tile(g, s, i) {
    const b = document.createElement('button');
    b.className = 'tile enter';
    b.style.animationDelay = Math.min(i * 18, 600) + 'ms';
    b.setAttribute('aria-label', `${g.title} — ${CONSOLE_BY_ID[g.console].name}`);
    const t = document.createElement('div');
    t.className = 'tilt';
    const cv = Case.front(g, s);
    t.append(cv);
    if (dots) { const d = document.createElement('i'); d.className = 'dot'; d.style.setProperty('--c', STATUS[g.status].color); d.title = STATUS[g.status].name; t.append(d); }
    b.append(t);
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = `${g.year} · ${g.publisher}`;
    b.append(m);

    b.addEventListener('pointermove', e => {
      const r = b.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      t.style.transform = `translateZ(30px) rotateY(${(x - .5) * 22}deg) rotateX(${(.5 - y) * 18}deg)`;
      cv.style.setProperty('--gx', x * 100 + '%');
      cv.style.setProperty('--gy', y * 100 + '%');
    });
    b.addEventListener('pointerleave', () => { t.style.transform = ''; });
    b.addEventListener('click', () => { t.style.transform = ''; UI.open(g, cv, 'front', games); });
    UI.tip(b, g);
    return b;
  }

  function render() {
    wall.innerHTML = '';
    if (!games.length) return UI.empty(wall);
    const base = innerWidth < 640 ? 0.62 : innerWidth < 1000 ? 0.85 : 1.05;
    const scaleFor = g => size === 'even' ? (base * 190) / Case.dims(g, 1).h : base;

    const groups = [];
    if (UI.state.sort === 'console') {
      games.forEach(g => { const last = groups[groups.length - 1]; last && last.id === g.console ? last.items.push(g) : groups.push({ id: g.console, items: [g] }); });
    } else groups.push({ id: null, items: games });

    let i = 0;
    groups.forEach(gr => {
      const sec = document.createElement('section');
      sec.className = 'sec';
      if (gr.id) {
        const c = CONSOLE_BY_ID[gr.id];
        sec.style.setProperty('--fc', famColor[c.fam]);
        sec.innerHTML = `<h3><span class="mini" style="${UI.miniVars(gr.id)}"></span>${c.name}<small>${gr.items.length} ${gr.items.length === 1 ? 'game' : 'games'}</small></h3>`;
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      gr.items.forEach(g => grid.append(tile(g, scaleFor(g), i++)));
      sec.append(grid);
      wall.append(sec);
    });
  }

  document.querySelectorAll('#size button').forEach(b => b.addEventListener('click', () => {
    size = b.dataset.z; document.querySelectorAll('#size button').forEach(x => x.classList.toggle('on', x === b)); render();
  }));
  document.querySelectorAll('#dots button').forEach(b => b.addEventListener('click', () => {
    dots = b.dataset.d === '1'; document.querySelectorAll('#dots button').forEach(x => x.classList.toggle('on', x === b)); render();
  }));

  UI.init({
    title: 'The Display Wall',
    intro: 'Every case face-out on its own stand, at its real size — a Switch case next to a big-box PC game. Move over one to tilt it in the light.',
    onChange: list => { games = list; render(); },
  });
  games = UI.list();
  render();
  let rt, lw = innerWidth;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (Math.abs(innerWidth - lw) > 80) { lw = innerWidth; render(); } }, 200); });
</script>
</body>
</html>
