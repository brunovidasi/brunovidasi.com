<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Blue Snake Revolution!</title>
<link rel="icon" href="images/icone.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Barra de Menu (equivalente ao JMenuBar do Java) -->
  <nav id="menubar">
    <div class="menu">
      <button class="menu-title">Jogo</button>
      <div class="menu-items">
        <button data-action="novoJogo">Novo Jogo <span class="shortcut">Ctrl+N</span></button>
        <hr>
        <button data-action="pausar">Pausar Jogo <span class="shortcut">Ctrl+P</span></button>
        <button data-action="despausar">Retornar Jogo <span class="shortcut">Ctrl+R</span></button>
        <hr>
        <button data-action="sair">Sair <span class="shortcut">Esc</span></button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-title">Editar</button>
      <div class="menu-items">
        <button data-action="bloquearParede">Bloquear Paredes <span class="shortcut">Ctrl+T</span></button>
        <button data-action="desbloquearParede">Desbloquear Paredes <span class="shortcut">Ctrl+Y</span></button>
        <hr>
        <button data-action="cobraMacho">Cobra Macho <span class="shortcut">Ctrl+M</span></button>
        <button data-action="cobraFemea">Cobra Fêmea <span class="shortcut">Ctrl+F</span></button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-title">Record</button>
      <div class="menu-items">
        <button data-action="records">Records <span class="shortcut">Ctrl+H</span></button>
        <hr>
        <button data-action="pontuacao">Ver Pontos Atuais <span class="shortcut">Ctrl+D</span></button>
      </div>
    </div>

    <div class="menu">
      <button class="menu-title">Ajuda</button>
      <div class="menu-items">
        <button data-action="manual">Manual</button>
        <hr>
        <button data-action="desenvolvedor">Sobre o desenvolvedor</button>
      </div>
    </div>
  </nav>

  <canvas id="grade" width="650" height="400"></canvas>

</div>

<!-- Modal genérico (equivalente ao JOptionPane) -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div id="modal-buttons"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
