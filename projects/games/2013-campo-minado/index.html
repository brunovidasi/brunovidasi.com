<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Campo Minado - Bruno Vieira</title>
<style>
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: #3c3c3c;
		font-family: Tahoma, Verdana, Arial, sans-serif;
		display: flex;
		flex-direction: column;
		align-items: center;
		min-height: 100vh;
	}

	/* ===== BARRA DE MENU ===== */
	#menubar {
		width: 100%;
		background: #ececec;
		border-bottom: 1px solid #999;
		display: flex;
		font-size: 13px;
		user-select: none;
		position: relative;
		z-index: 10;
	}
	.menu-item { position: relative; }
	.menu-title {
		padding: 6px 12px;
		cursor: pointer;
	}
	.menu-title:hover, .menu-item.open .menu-title { background: #cfe4ff; }
	.menu-dropdown {
		display: none;
		position: absolute;
		top: 100%;
		left: 0;
		background: #fdfdfd;
		border: 1px solid #999;
		box-shadow: 2px 2px 6px rgba(0,0,0,.3);
		min-width: 210px;
	}
	.menu-item.open .menu-dropdown { display: block; }
	.menu-option {
		padding: 6px 14px;
		cursor: pointer;
		white-space: nowrap;
	}
	.menu-option:hover { background: #cfe4ff; }
	.menu-sep { border-top: 1px solid #ccc; margin: 4px 0; }

	/* ===== TABULEIRO ===== */
	#gameWrap { padding: 16px; }
	#status {
		color: #eee;
		text-align: center;
		font-size: 14px;
		margin-bottom: 8px;
	}
	canvas {
		display: block;
		border: 2px solid #1a1a1a;
		cursor: pointer;
	}

	/* ===== MODAL ===== */
	#overlay {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,.5);
		align-items: center;
		justify-content: center;
		z-index: 100;
	}
	#modal {
		background: #fdfdfd;
		border-radius: 4px;
		min-width: 320px;
		max-width: 480px;
		box-shadow: 0 4px 20px rgba(0,0,0,.4);
		overflow: hidden;
	}
	#modal h3 {
		margin: 0;
		padding: 10px 16px;
		background: #2b6cb0;
		color: #fff;
		font-size: 15px;
	}
	#modal .body {
		padding: 16px;
		white-space: pre-line;
		font-size: 13px;
		line-height: 1.5;
	}
	#modal .actions {
		padding: 10px 16px;
		text-align: right;
		background: #f0f0f0;
	}
	#modal button {
		padding: 5px 14px;
		cursor: pointer;
	}
</style>
</head>
<body>

<div id="menubar">
	<div class="menu-item" data-menu="jogo">
		<div class="menu-title">Jogo</div>
		<div class="menu-dropdown">
			<div class="menu-option" data-action="novoJogo">Novo Jogo</div>
			<div class="menu-sep"></div>
			<div class="menu-option" data-action="novo30">Novo Jogo - Iniciante</div>
			<div class="menu-option" data-action="novo40">Novo Jogo - Fácil</div>
			<div class="menu-option" data-action="novo50">Novo Jogo - Médio</div>
			<div class="menu-option" data-action="novo60">Novo Jogo - Intermediário</div>
			<div class="menu-option" data-action="novo75">Novo Jogo - Difícil</div>
			<div class="menu-option" data-action="novo100">Novo Jogo - Impossível</div>
		</div>
	</div>
	<div class="menu-item" data-menu="record">
		<div class="menu-title">Record</div>
		<div class="menu-dropdown">
			<div class="menu-option" data-action="records">Records</div>
			<div class="menu-sep"></div>
			<div class="menu-option" data-action="pontuacao">Ver Pontos Atuais</div>
		</div>
	</div>
	<div class="menu-item" data-menu="ajuda">
		<div class="menu-title">Ajuda</div>
		<div class="menu-dropdown">
			<div class="menu-option" data-action="manual">Manual</div>
			<div class="menu-sep"></div>
			<div class="menu-option" data-action="sobre">Sobre o desenvolvedor</div>
		</div>
	</div>
</div>

<div id="gameWrap">
	<div id="status">Minas: 60 &nbsp;|&nbsp; Pontos: 0</div>
	<canvas id="board"></canvas>
</div>

<div id="overlay">
	<div id="modal">
		<h3 id="modalTitulo"></h3>
		<div class="body" id="modalTexto"></div>
		<div class="actions"><button id="modalOk">OK</button></div>
	</div>
</div>

<script>
(function () {
	'use strict';

	// ===== Configuração do tabuleiro (igual ao Java) =====
	var LINHAS = 15;
	var COLUNAS = 25;
	var TAM = 24; // tamanho de cada célula em pixels

	var NAO_VISITADO = 0;
	var COM_BANDEIRA = 1;
	var VISITADO = 2;

	var CORES_NUM = {
		1: '#00bfff', // azul claro
		2: '#ffa500', // laranja
		3: '#00ff7f', // verde claro
		4: '#0000ff', // azul
		5: '#ff0000', // vermelho
		6: '#ff00ff'  // magenta (6+)
	};

	var canvas = document.getElementById('board');
	var ctx = canvas.getContext('2d');
	canvas.width = 2 + TAM * COLUNAS;
	canvas.height = 2 + TAM * LINHAS;

	var estado, minado, qtdMinas, jogoEmAndamento, jogadorVenceu, pontos;

	function setPontos(v) {
		pontos = v;
		document.getElementById('status').textContent =
			'Minas: ' + qtdMinas + '  |  Pontos: ' + pontos;
	}

	// ===== Iniciar Jogo =====
	function iniciarJogo(minaCont) {
		setPontos(0);
		qtdMinas = minaCont;
		console.log('Jogo iniciado com ' + qtdMinas + ' minas.');

		while (true) {
			jogoEmAndamento = true;
			jogadorVenceu = false;
			minado = [];
			estado = [];
			for (var r = 0; r < LINHAS; r++) {
				minado.push(new Array(COLUNAS).fill(false));
				estado.push(new Array(COLUNAS).fill(NAO_VISITADO));
			}

			for (var i = 0; i < qtdMinas; i++) {
				var r2, c2;
				while (true) {
					r2 = Math.floor(LINHAS * Math.random());
					c2 = Math.floor(COLUNAS * Math.random());
					if ((r2 + c2 > 2) && (r2 < LINHAS - 1 || c2 < COLUNAS - 1) && !minado[r2][c2]) {
						break;
					}
				}
				minado[r2][c2] = true;
			}

			visitar(0, 0);

			if (configuracaoOK()) break;
		}
		draw();
	}

	function configuracaoOK() {
		if (estado[LINHAS - 1][COLUNAS - 1] === VISITADO) {
			return false;
		}
		return true;
	}

	function visitarVizinho(row, col) {
		if (row > 0 && estado[row - 1][col] > NAO_VISITADO) return true;
		if (row < LINHAS - 1 && estado[row + 1][col] > NAO_VISITADO) return true;
		if (col > 0 && estado[row][col - 1] > NAO_VISITADO) return true;
		if (col < COLUNAS - 1 && estado[row][col + 1] > NAO_VISITADO) return true;
		return false;
	}

	function marcar(row, col) {
		estado[row][col] = VISITADO;
		setPontos(pontos + 1);
	}

	function visitar(row, col) {
		if (minado[row][col]) {
			jogoEmAndamento = false;
			jogadorVenceu = false;
		} else {
			marcar(row, col);
			if (estado[LINHAS - 1][COLUNAS - 1] === VISITADO) {
				jogoEmAndamento = false;
				jogadorVenceu = true;
				calculaPontos(pontos);
			}
		}
	}

	function bombaCont(row, col) {
		var ct = 0;
		if (row > 0) {
			if (col > 0 && minado[row - 1][col - 1]) ct++;
			if (minado[row - 1][col]) ct++;
			if (col < COLUNAS - 1 && minado[row - 1][col + 1]) ct++;
		}
		if (col > 0 && minado[row][col - 1]) ct++;
		if (col < COLUNAS - 1 && minado[row][col + 1]) ct++;
		if (row < LINHAS - 1) {
			if (col > 0 && minado[row + 1][col - 1]) ct++;
			if (minado[row + 1][col]) ct++;
			if (col < COLUNAS - 1 && minado[row + 1][col + 1]) ct++;
		}
		return ct;
	}

	function calculaPontos(pt) {
		pt = pt + 5;
		pt = pt + qtdMinas;
		setPontos(pt);
		mostrarPontuacao(pt);
	}

	function mostrarPontuacao(pontuacao) {
		var texto = pontuacao > 1 ? (pontuacao + ' pontos.') : (pontuacao + ' ponto.');
		abrirModal('Sua pontuação é:', texto);
	}

	// ===== Clique do mouse =====
	function doClick(evt, isFlag) {
		var rect = canvas.getBoundingClientRect();
		var x = evt.clientX - rect.left;
		var y = evt.clientY - rect.top;

		var row = Math.floor((y - 1) / TAM);
		var col = Math.floor((x - 1) / TAM);

		if (row < 0 || row >= LINHAS || col < 0 || col >= COLUNAS) return;
		if (estado[row][col] === VISITADO) return;
		if (!visitarVizinho(row, col)) return;
		if (!jogoEmAndamento) return;

		if (isFlag) {
			if (estado[row][col] === NAO_VISITADO) {
				estado[row][col] = COM_BANDEIRA;
				if (minado[row][col]) setPontos(pontos + 1);
			} else {
				estado[row][col] = NAO_VISITADO;
				if (minado[row][col]) setPontos(pontos - 1);
			}
		} else {
			if (estado[row][col] === COM_BANDEIRA) return;
			visitar(row, col);
		}
		draw();
	}

	canvas.addEventListener('click', function (evt) { doClick(evt, evt.shiftKey); });
	canvas.addEventListener('contextmenu', function (evt) {
		evt.preventDefault();
		doClick(evt, true);
	});

	// ===== Desenho (equivalente ao paintComponent) =====
	function draw() {
		ctx.fillStyle = '#808080';
		ctx.fillRect(0, 0, canvas.width, canvas.height);

		for (var r = 0; r < LINHAS; r++) {
			for (var c = 0; c < COLUNAS; c++) {
				var x = 2 + TAM * c;
				var y = 2 + TAM * r;
				var w = 23, h = 23;
				var isTarget = (r === LINHAS - 1 && c === COLUNAS - 1);
				var showBombIcon = false;
				var bg;

				if (minado[r][c] && !jogoEmAndamento) {
					if (jogadorVenceu) {
						bg = '#0000ff';
					} else {
						bg = '#ff0000';
						showBombIcon = true;
					}
				} else if (estado[r][c] === COM_BANDEIRA) {
					bg = '#808080';
				} else if (isTarget) {
					bg = '#000000';
				} else {
					bg = '#808080';
				}

				// bloco 3D: "levantado" se não visitado, "plano" se visitado
				draw3DRect(x, y, w, h, bg, estado[r][c] !== VISITADO);

				if (estado[r][c] === COM_BANDEIRA) {
					drawFlag(x, y);
				} else if (showBombIcon) {
					drawBomb(x, y);
				} else if (estado[r][c] === VISITADO) {
					var bombas = bombaCont(r, c);
					if (bombas > 0) {
						ctx.fillStyle = CORES_NUM[Math.min(bombas, 6)];
						ctx.font = 'bold 15px Georgia, serif';
						ctx.textBaseline = 'alphabetic';
						ctx.fillText('' + bombas, x + 6, y + 16);
					}
				}
			}
		}

		if (!jogoEmAndamento) {
			ctx.fillStyle = 'rgba(0,0,0,0.35)';
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			ctx.fillStyle = '#ffffff';
			ctx.font = 'bold 30px Georgia, serif';
			ctx.textBaseline = 'alphabetic';
			if (jogadorVenceu) {
				ctx.fillText('PARABÉNS!', 20, 200);
			} else {
				ctx.fillText('VOCÊ PERDEU!', canvas.width / 2 - 150, 200);
			}
		}
	}

	function draw3DRect(x, y, w, h, color, raised) {
		ctx.fillStyle = color;
		ctx.fillRect(x, y, w, h);

		var light = 'rgba(255,255,255,0.6)';
		var dark = 'rgba(0,0,0,0.5)';
		ctx.strokeStyle = raised ? light : dark;
		ctx.beginPath();
		ctx.moveTo(x, y + h);
		ctx.lineTo(x, y);
		ctx.lineTo(x + w, y);
		ctx.stroke();

		ctx.strokeStyle = raised ? dark : light;
		ctx.beginPath();
		ctx.moveTo(x + w, y);
		ctx.lineTo(x + w, y + h);
		ctx.lineTo(x, y + h);
		ctx.stroke();
	}

	function drawBomb(x, y) {
		ctx.font = '16px sans-serif';
		ctx.textBaseline = 'alphabetic';
		ctx.fillText('💣', x + 3, y + 18);
	}

	function drawFlag(x, y) {
		ctx.font = '16px sans-serif';
		ctx.textBaseline = 'alphabetic';
		ctx.fillText('🚩', x + 3, y + 18);
	}

	// ===== Menu =====
	var menuItems = document.querySelectorAll('.menu-item');
	menuItems.forEach(function (item) {
		item.querySelector('.menu-title').addEventListener('click', function (e) {
			e.stopPropagation();
			var wasOpen = item.classList.contains('open');
			menuItems.forEach(function (mi) { mi.classList.remove('open'); });
			if (!wasOpen) item.classList.add('open');
		});
	});
	document.addEventListener('click', function () {
		menuItems.forEach(function (mi) { mi.classList.remove('open'); });
	});

	var acoes = {
		novoJogo: function () { iniciarJogo(qtdMinas); },
		novo30: function () { iniciarJogo(30); },
		novo40: function () { iniciarJogo(40); },
		novo50: function () { iniciarJogo(50); },
		novo60: function () { iniciarJogo(60); },
		novo75: function () { iniciarJogo(75); },
		novo100: function () { iniciarJogo(100); },
		records: function () {
			abrirModal('Records', 'Banco de Dados ainda não implementado, aguarde a próxima atualização.');
		},
		pontuacao: function () { mostrarPontuacao(pontos); },
		manual: function () {
			abrirModal('Aprenda a Jogar',
				'Controladores:\n\n' +
				'• Botão esquerdo do mouse - Revela o número de bombas, ou explode.\n' +
				'• Botão direito do mouse (ou Shift + clique) - Marca o quadrado como bomba.\n\n' +
				'Como Jogar:\n\n' +
				'• Tente passar por todos os quadrados clicando ou marcando como bomba, sem estourar nenhuma. ' +
				'Os quadrados vão te dar as dicas necessárias para continuar o seu caminho.\n\n' +
				'Objetivo:\n\n' +
				'• Chegar ao último quadrado inferior direito marcado de preto :)\n\n' +
				'Boa sorte pequeno gafanhoto!');
		},
		sobre: function () {
			abrirModal('Sobre o Desenvolvedor:',
				'Bruno Vieira\n\n' +
				'www.brunovidasi.com | bruno@brunovidasi.com\n\n' +
				'Convertido de Java (Swing) para HTML/CSS/JS.');
		}
	};

	document.querySelectorAll('.menu-option').forEach(function (opt) {
		opt.addEventListener('click', function (e) {
			e.stopPropagation();
			var acao = acoes[opt.getAttribute('data-action')];
			if (acao) acao();
			menuItems.forEach(function (mi) { mi.classList.remove('open'); });
		});
	});

	// ===== Modal =====
	function abrirModal(titulo, texto) {
		document.getElementById('modalTitulo').textContent = titulo;
		document.getElementById('modalTexto').textContent = texto;
		document.getElementById('overlay').style.display = 'flex';
	}
	document.getElementById('modalOk').addEventListener('click', function () {
		document.getElementById('overlay').style.display = 'none';
	});

	// ===== Início =====
	iniciarJogo(60);
})();
</script>
</body>
</html>
