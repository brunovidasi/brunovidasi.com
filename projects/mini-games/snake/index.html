<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blue Snake Revolution!</title>
<link rel="icon" href="images/icone.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav id="menubar">
  <div class="menu">
    <button class="menu-title">Game</button>
    <div class="menu-items">
      <button data-action="newGame">New Game</button>
      <hr>
      <button data-action="newEasy">New Game - 150ms - Easy</button>
      <button data-action="newMedium">New Game - 100ms - Medium</button>
      <button data-action="newHard">New Game - 60ms - Hard</button>
      <hr>
      <button data-action="pause">Pause Game</button>
      <button data-action="resume">Resume Game</button>
    </div>
  </div>

  <div class="menu">
    <button class="menu-title">Edit</button>
    <div class="menu-items">
      <button data-action="lockWalls" id="lockWallsOption">  Lock Walls</button>
      <button data-action="unlockWalls" id="unlockWallsOption">✓ Unlock Walls</button>
      <hr>
      <button data-action="orangeSnake" id="orangeSnakeOption">✓ Orange Snake</button>
      <button data-action="greenSnake" id="greenSnakeOption">  Green Snake</button>
    </div>
  </div>

  <div class="menu">
    <button class="menu-title">Help</button>
    <div class="menu-items">
      <button data-action="manual">Manual</button>
      <hr>
      <button data-action="developer">About the developer</button>
    </div>
  </div>
</nav>

<div id="gameWrap">
  <div id="status">Score: 0 &nbsp;|&nbsp; Speed: 150ms &nbsp;|&nbsp; Level: 1</div>
  <canvas id="grade" width="650" height="400"></canvas>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div id="modal-buttons"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
