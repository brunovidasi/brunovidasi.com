<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eDM T&Cs HTML Add Link</title>

<style>
:root {
    --bg: #eef3f8;
    --bg-strong: #e4ebf3;
    --panel: rgba(255, 255, 255, 0.9);
    --panel-alt: #f8fafc;
    --line: #dfe7f1;
    --line-strong: #c9d4e3;
    --text: #1d2a39;
    --muted: #66758a;
    --accent: #1f3c88;
    --accent-soft: #e9efff;
    --accent-strong: #152d62;
    --shadow: 0 18px 45px rgba(15, 23, 42, 0.09);
    --radius: 18px;
}

* {
    box-sizing: border-box;
    font-family: "Segoe UI", "Inter", Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 38px 22px;
    background:
        radial-gradient(circle at top left, rgba(103, 126, 234, 0.14), transparent 26%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 25%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-strong) 100%);
    color: var(--text);
}

.app {
    max-width: 1520px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(210, 220, 233, 0.8);
    border-radius: 24px;
    padding: 28px 28px 24px;
    box-shadow: var(--shadow);
}

h1 {
    margin: 0 0 18px;
    font-size: clamp(1.8rem, 2vw, 2.4rem);
    line-height: 1.15;
    letter-spacing: -0.04em;
}

.toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
}

input[type="text"] {
    flex: 1;
    min-width: 300px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 0.94rem;
    background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
    color: var(--text);
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
}

input[type="text"]:focus {
    outline: none;
    border-color: rgba(31, 60, 136, 0.55);
    box-shadow: 0 0 0 4px rgba(92, 118, 199, 0.12);
}

button {
    appearance: none;
    border: 1px solid rgba(19, 36, 76, 0.08);
    border-radius: 12px;
    padding: 12px 18px;
    color: white;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
}

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.04);
}

button:active {
    transform: translateY(0);
}

#greyLinkBtn {
    background: linear-gradient(180deg, #2d2d2d 0%, #181818 100%);
    box-shadow: 0 8px 18px rgba(20, 20, 20, 0.2);
}

#blueLinkBtn {
    background: linear-gradient(180deg, #0b6bcc 0%, #0059b2 100%);
    box-shadow: 0 8px 18px rgba(0, 86, 185, 0.2);
}

#removeLinkBtn {
    background: linear-gradient(180deg, #e45151 0%, #c92f2f 100%);
    box-shadow: 0 8px 18px rgba(188, 42, 42, 0.2);
}

#copyBtn {
    background: linear-gradient(180deg, #eff4ff 0%, #e2eafc 100%);
    color: var(--accent-strong);
    border-color: rgba(31, 60, 136, 0.14);
    box-shadow: 0 8px 15px rgba(31, 60, 136, 0.08);
}

.container {
    display: flex;
    gap: 22px;
    align-items: stretch;
}

.panel {
    flex: 1;
    min-width: 0;
}

.panel h2 {
    margin: 0 0 10px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
}

#editor,
#output {
    width: 100%;
    height: 620px;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 16px 16px;
    overflow-y: auto;
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
}

#editor {
    background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
    outline: none;
    white-space: pre-wrap;
    line-height: 1.7;
    color: var(--text);
}

#editor:empty:before {
    content: "Paste your content here...";
    color: #8a97ab;
}

#editor a {
    text-decoration: underline;
}

#output {
    background: linear-gradient(180deg, #fbfcff 0%, #f4f8ff 100%);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.92rem;
    line-height: 1.6;
    white-space: pre-wrap;
    margin: 0;
    color: #233349;
}

.status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.92rem;
}

.wrapBtn {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
}

@media (max-width: 1000px) {
    body {
        padding: 20px 14px;
    }

    .app {
        padding: 20px 18px 18px;
        border-radius: 18px;
    }

    .container {
        flex-direction: column;
    }

    .toolbar {
        align-items: stretch;
    }

    input[type="text"] {
        min-width: 0;
        width: 100%;
    }

    button {
        width: 100%;
    }

    #editor,
    #output {
        height: 340px;
    }
}
</style>
</head>
<body>

<div class="app">

    <h1>eDM T&Cs HTML Add Link</h1>

    <div class="toolbar">

        <input
            type="text"
            id="linkUrl"
            placeholder="Paste URL here..."
        >

        <button id="greyLinkBtn">
            Add Grey Link
        </button>

        <button id="blueLinkBtn">
            Add Blue Link
        </button>

        <button id="removeLinkBtn">
            🔗 Remove Link
        </button>

        

    </div>

    <div class="container">

        <div class="panel">
            <h2>Editor</h2>
            <div id="editor" contenteditable="true"></div>
        </div>

        <div class="panel">
            <h2>HTML Output</h2>
            <pre id="output"></pre>

            
        </div>

    </div>

    <div class="status">
        Select text → Enter URL → Click a link button.
    </div>

    <div class="wrapBtn">
        <button id="copyBtn">
            Copy HTML Output
        </button>
    </div>

</div>

<script>
const editor = document.getElementById('editor');
const output = document.getElementById('output');
const linkInput = document.getElementById('linkUrl');

let savedRange = null;

function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function saveSelection() {

    const selection = window.getSelection();

    if (
        selection.rangeCount > 0 &&
        editor.contains(selection.anchorNode)
    ) {
        savedRange = selection.getRangeAt(0).cloneRange();
    }
}

editor.addEventListener('mouseup', saveSelection);
editor.addEventListener('keyup', saveSelection);

function rgbToHex(rgb) {

    if (!rgb) return '#333333';

    // already hex
    if (rgb.startsWith('#')) return rgb;

    const result = rgb.match(/\d+/g);

    if (!result || result.length < 3) return '#333333';

    return "#" + ((1 << 24) + (parseInt(result[0]) << 16) + (parseInt(result[1]) << 8) + parseInt(result[2]))
        .toString(16)
        .slice(1)
        .toUpperCase();
}

function processNode(node) {

    if (node.nodeType === Node.TEXT_NODE) {
        return escapeHtml(node.textContent);
    }

    if (node.nodeType === Node.ELEMENT_NODE) {

        if (node.tagName === 'A') {

            const color = rgbToHex(node.style.color || '#333333');

            return `<a href="${node.getAttribute('href')}" target="_blank" style="color: ${color}; text-decoration:underline;">${escapeHtml(node.textContent)}</a>`;
        }

        let content = '';

        node.childNodes.forEach(child => {
            content += processNode(child);
        });

        if (node.tagName === 'DIV') {
            return content + '<br />';
        }

        if (node.tagName === 'BR') {
            return '<br />';
        }

        return content;
    }

    return '';
}

function generateHtml() {

    let html = '';

    editor.childNodes.forEach(node => {
        html += processNode(node);
    });

    output.textContent = html;
}

function addLink(color) {

    const url = linkInput.value.trim();

    if (!url) {
        alert('Please enter a URL.');
        return;
    }

    if (!savedRange) {
        alert('Please select some text first.');
        return;
    }

    const selection = window.getSelection();

    selection.removeAllRanges();
    selection.addRange(savedRange);

    const link = document.createElement('a');

    link.href = url;
    link.target = '_blank';
    link.style.color = color;
    link.style.textDecoration = 'underline';

    try {

        savedRange.surroundContents(link);

    } catch {

        const content = savedRange.extractContents();
        link.appendChild(content);
        savedRange.insertNode(link);
    }

    savedRange = null;
    linkInput.value = '';

    generateHtml();
}

function removeLink() {

    const selection = window.getSelection();

    if (
        selection.rangeCount === 0 ||
        !editor.contains(selection.anchorNode)
    ) {
        alert('Select linked text first.');
        return;
    }

    let node = selection.anchorNode;

    while (node && node !== editor) {

        if (node.nodeType === 1 && node.tagName === 'A') {

            const textNode = document.createTextNode(node.textContent);

            node.parentNode.replaceChild(textNode, node);

            generateHtml();

            return;
        }

        node = node.parentNode;
    }

    alert('No link found in selected text.');
}

document.getElementById('greyLinkBtn').addEventListener('click', () => {
    addLink('#333333');
});

document.getElementById('blueLinkBtn').addEventListener('click', () => {
    addLink('#006FCF');
});

document.getElementById('removeLinkBtn').addEventListener('click', removeLink);

linkInput.addEventListener('keydown', function(e) {

    if (e.key === 'Enter') {
        addLink('#333333');
    }
});

document.addEventListener('keydown', function(e) {

    if ((e.ctrlKey || e.metaKey) &&
        e.key.toLowerCase() === 'k') {

        e.preventDefault();

        linkInput.focus();
        linkInput.select();
    }
});

editor.addEventListener('input', generateHtml);

document.getElementById('copyBtn').addEventListener('click', async () => {

    try {

        await navigator.clipboard.writeText(output.textContent);

        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;

        btn.textContent = 'Copied!';

        setTimeout(() => {
            btn.textContent = original;
        }, 1500);

    } catch {

        alert('Could not copy HTML.');
    }
});

generateHtml();
</script>

</body>
</html>
