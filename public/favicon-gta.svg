<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- wanted level: two stars over three, in the GTA page's sunset (css/gta.css) -->
  <defs>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="4" y1="5" x2="28" y2="27"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6a5a"/><stop offset="1" stop-color="#e8337c"/></linearGradient>
    <path id="s" d="M0 -5 L1.18 -1.62 L4.76 -1.55 L1.9 0.62 L2.94 4.05 L0 2 L-2.94 4.05 L-1.9 0.62 L-4.76 -1.55 L-1.18 -1.62 Z"/>
    <clipPath id="stars">
      <use href="#s" transform="translate(10.5 10.5)"/>
      <use href="#s" transform="translate(21.5 10.5)"/>
      <use href="#s" transform="translate(5.5 21.5)"/>
      <use href="#s" transform="translate(16 21.5)"/>
      <use href="#s" transform="translate(26.5 21.5)"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <rect width="32" height="32" fill="url(#sun)" clip-path="url(#stars)"/>
</svg>
