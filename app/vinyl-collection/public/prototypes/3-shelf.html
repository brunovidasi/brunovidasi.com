<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype 3 — Shelf & spines</title>
<style>
@font-face{font-family:'Fraunces';src:url('../fonts/fraunces-latin.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Space Grotesk';src:url('../fonts/space-grotesk-latin.woff2') format('woff2');font-weight:400 600;font-display:swap}

:root{--ink:#17140F;--paper:#F2EAD8;--gold:#C99A2E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--paper);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;
  background:linear-gradient(#2a1d12,#1a120a 60%),#1a120a}

.protonav{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:999;display:flex;gap:2px;background:rgba(20,17,13,.85);backdrop-filter:blur(8px);border:1px solid rgba(242,234,216,.2);border-radius:99px;padding:4px;font:500 12px 'Space Grotesk',sans-serif;white-space:nowrap}
.protonav a{color:#F2EAD8;text-decoration:none;padding:6px 11px;border-radius:99px;opacity:.7}
.protonav a[aria-current]{background:#C99A2E;color:#17140F;opacity:1}

header{max-width:1100px;margin:0 auto;padding:64px 20px 12px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
h1{font:600 30px 'Fraunces',serif;margin:0;letter-spacing:-.01em}
header small{display:block;opacity:.55;font-size:12px;margin-top:4px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl button,.ctl input{font:500 12px 'Space Grotesk',sans-serif;border:1px solid rgba(242,234,216,.28);background:transparent;color:var(--paper);border-radius:99px;padding:7px 14px;cursor:pointer}
.ctl input{cursor:text;width:150px;border-radius:6px}
.ctl input::placeholder{color:rgba(242,234,216,.4)}
.ctl button.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}

#shelves{max-width:1100px;margin:0 auto;padding:10px 20px 90px}
.row{display:flex;align-items:flex-end;gap:3px;padding:0 14px;height:262px;position:relative}
.board{height:18px;margin:0 0 28px;border-radius:2px;background:linear-gradient(#8a5a2e,#5c3a1c);box-shadow:0 10px 18px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,220,170,.3)}

.spine{flex:none;height:var(--h);width:var(--w);border:0;padding:0;cursor:pointer;background:var(--c,#555);color:var(--fg,#fff);
  border-radius:2px 2px 0 0;position:relative;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .6s;
  writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;
  box-shadow:inset 2px 0 0 rgba(255,255,255,.14),inset -3px 0 0 rgba(0,0,0,.25),inset 0 10px 0 rgba(0,0,0,.14),inset 0 -10px 0 rgba(0,0,0,.14);font-family:'Space Grotesk',sans-serif}
.spine:hover,.spine:focus-visible{transform:translateY(-18px);outline:none}
.spine b{font:600 13px 'Fraunces',serif;flex:1;min-height:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;letter-spacing:.01em}
.spine span{font-size:10px;opacity:.75;white-space:nowrap;max-height:38%;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.06em}
.spine em{font-style:normal;font-size:9px;opacity:.65;letter-spacing:.05em}
.spine{--pad:0}

/* pulled-out record */
.pull{position:fixed;inset:0;z-index:1000;background:rgba(10,7,4,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.pull.open{display:flex}
.card{position:relative;display:flex;gap:64px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:820px}
.sleeve{position:relative;width:min(330px,72vw);aspect-ratio:1;flex:none;perspective:900px}
.sleeve .disc{position:absolute;left:6%;top:3%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c99a2e 0 14%,#0b0a08 14.5% 15.5%,transparent 16%),repeating-radial-gradient(circle,#0d0d0d 0 2px,#1b1b1b 2px 3px);animation:slideOut .7s .25s cubic-bezier(.2,.8,.3,1) forwards;transform:translateX(0)}
.sleeve .face{position:absolute;inset:0;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform-origin:0 50%;animation:pullOut .55s cubic-bezier(.2,.9,.3,1)}
@keyframes pullOut{from{transform:translateX(-90px) rotateY(-78deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateX(18%)}}
.cv{background-size:cover;background-position:center}
.ctext{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;font-size:13px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ctext b{font:600 26px/1.05 'Fraunces',serif;margin-bottom:4px}
.txt{max-width:280px;position:relative;z-index:2}
.txt h2{font:600 30px/1.05 'Fraunces',serif;margin:0 0 6px}
.txt p{margin:0 0 14px;opacity:.75}
.tag{display:inline-block;border:1px solid rgba(242,234,216,.3);border-radius:99px;padding:3px 10px;font-size:11px;margin:0 4px 4px 0}
.txt .m{font-size:13px;opacity:.6;margin-top:8px}
.close{position:absolute;right:-6px;top:-40px;background:none;border:0;color:var(--paper);font-size:22px;cursor:pointer;opacity:.7}
</style>
</head>
<body>
<nav class="protonav">
  <a href="1-crate.html">1 Crate</a><a href="2-turntable.html">2 Deck</a><a href="3-shelf.html" aria-current="page">3 Shelf</a><a href="4-map.html">4 Map</a><a href="5-stats.html">5 Stats</a>
</nav>

<header>
  <div><h1>The Shelf</h1><small id="src">Loading…</small></div>
  <div class="ctl" id="ctl">
    <input type="search" id="q" placeholder="Search…" aria-label="Search">
    <button data-s="artist" class="on">A–Z</button><button data-s="year">Year</button><button data-s="added">Recent</button><button data-s="color" id="colorBtn">Colour</button>
  </div>
</header>

<div id="shelves"></div>

<div class="pull" id="pull"><div class="card" id="card"></div></div>

<script>
/* ---- shared data loader (same source as the real app) ---- */
const CACHE_KEY='vinyl_collection_cache_v2';
const SAMPLE=[
['Pink Floyd','The Dark Side of the Moon',1973,'Rock','Prog Rock','Harvest'],['Miles Davis','Kind of Blue',1959,'Jazz','Modal','Columbia'],
['Fleetwood Mac','Rumours',1977,'Rock','Soft Rock','Warner Bros.'],['Daft Punk','Random Access Memories',2013,'Electronic','Disco','Columbia'],
['Stevie Wonder','Songs in the Key of Life',1976,'Funk / Soul','Soul','Tamla'],['Radiohead','OK Computer',1997,'Rock','Alternative Rock','Parlophone'],
['Nirvana','Nevermind',1991,'Rock','Grunge','DGC'],['Massive Attack','Mezzanine',1998,'Electronic','Trip Hop','Virgin'],
['John Coltrane','A Love Supreme',1965,'Jazz','Free Jazz','Impulse!'],['Portishead','Dummy',1994,'Electronic','Trip Hop','Go! Discs'],
['David Bowie','Low',1977,'Rock','Art Rock','RCA'],['Kendrick Lamar','To Pimp a Butterfly',2015,'Hip Hop','Conscious','Interscope'],
['Talking Heads','Remain in Light',1980,'Rock','New Wave','Sire'],['Joni Mitchell','Blue',1971,'Folk','Singer-Songwriter','Reprise'],
['Aphex Twin','Selected Ambient Works 85-92',1992,'Electronic','Ambient','R&S'],['The Beatles','Abbey Road',1969,'Rock','Pop Rock','Apple'],
['Herbie Hancock','Head Hunters',1973,'Jazz','Jazz-Funk','Columbia'],['Amy Winehouse','Back to Black',2006,'Funk / Soul','Soul','Island'],
['Kraftwerk','Trans-Europe Express',1977,'Electronic','Synth-pop','Kling Klang'],['Nina Simone','Pastel Blues',1965,'Jazz','Vocal','Philips'],
['Tame Impala','Currents',2015,'Rock','Psychedelic Rock','Modular'],['Lady Gaga','The Fame',2008,'Pop','Synth-pop','Interscope'],
['Björk','Homogenic',1997,'Electronic','Art Pop','One Little Indian'],['Led Zeppelin','IV',1971,'Rock','Hard Rock','Atlantic'],
['Frank Ocean','Blonde',2016,'Funk / Soul','Contemporary R&B',"Boys Don't Cry"],['Boards of Canada','Music Has the Right to Children',1998,'Electronic','IDM','Warp'],
['Bob Marley & The Wailers','Exodus',1977,'Reggae','Roots Reggae','Island'],['Beach House','Depression Cherry',2015,'Rock','Dream Pop','Sub Pop'],
['A Tribe Called Quest','The Low End Theory',1991,'Hip Hop','Jazzy Hip-Hop','Jive'],['Fela Kuti','Zombie',1977,'Funk / Soul','Afrobeat','Coconut'],
['The Cure','Disintegration',1989,'Rock','Goth Rock','Fiction'],['Caribou','Swim',2010,'Electronic','House','City Slang'],
];
const isVinyl=r=>(r.basic_information.formats||[]).some(f=>f.name==='Vinyl');
function norm(r){const b=r.basic_information;return{id:r.id,title:b.title,artist:(b.artists||[]).map(a=>a.name.replace(/\s\(\d+\)$/,'')).join(', ')||'Unknown',year:b.year||0,cover:b.cover_image||b.thumb||'',thumb:b.thumb||b.cover_image||'',genres:b.genres||[],styles:b.styles||[],label:((b.labels||[])[0]||{}).name||'',added:r.date_added||''}}
async function loadRecords(){
  try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c&&c.data&&c.data.length)return{recs:c.data.filter(isVinyl).map(norm),source:'your cached collection'}}catch(e){}
  try{const res=await fetch('https://api.discogs.com/users/brunovidasi/collection/folders/0/releases?per_page=100');if(res.ok){const d=await res.json();const v=(d.releases||[]).filter(isVinyl);if(v.length)return{recs:v.map(norm),source:'Discogs (first 100 records)'}}}catch(e){}
  return{recs:SAMPLE.map((s,i)=>({id:-i-1,artist:s[0],title:s[1],year:s[2],genres:[s[3]],styles:[s[4]],label:s[5],cover:'',thumb:'',added:new Date(2018+(i*7)%8,(i*5)%12,1+i%27).toISOString()})),source:'sample data (Discogs unreachable)'}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const fallbackBg=r=>{const h=hash(r.artist+r.title)%360;return `linear-gradient(135deg,hsl(${h} 45% 38%),hsl(${(h+40)%360} 50% 18%))`};
const coverBg=(r,thumb)=>{const u=thumb?r.thumb:r.cover;return u?`url("${u.replace(/"/g,'%22')}"),${fallbackBg(r)}`:fallbackBg(r)};
const coverText=r=>r.cover?'':`<span class="ctext"><b>${esc(r.title)}</b>${esc(r.artist)}</span>`;
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
/* average colour of the cover; falls back to a hash colour if the image host blocks canvas reads (CORS) */
function dominant(r){return new Promise(res=>{
  const fb=()=>res({h:hash(r.artist+r.title)%360,s:.45,l:.38,real:false});
  if(!r.thumb)return fb();
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=10;const x=c.getContext('2d');x.drawImage(im,0,0,10,10);const d=x.getImageData(0,0,10,10).data;let R=0,G=0,B=0,n=0;for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++}res({...rgb2hsl(R/n,G/n,B/n),real:true})}catch(e){fb()}};
  im.onerror=fb;im.src=r.thumb;
})}
async function eachLimit(items,n,fn){let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}}))}
/* ---- end shared ---- */

const $=id=>document.getElementById(id);
let recs=[],sort='artist',query='';
const colors=new Map();   // record -> {h,s,l}

// deterministic "physical" size per record so the shelf looks uneven
const dims=r=>{const h=hash(r.title+r.artist);return{w:28+h%16,h:216+(h>>4)%36}};
const spineColor=r=>{const c=colors.get(r)||{h:hash(r.artist+r.title)%360,s:.45,l:.38};return{bg:`hsl(${c.h.toFixed(0)} ${Math.round(Math.max(.25,Math.min(.7,c.s+.1))*100)}% ${Math.round(Math.max(.22,Math.min(.5,c.l))*100)}%)`,dark:Math.max(.22,Math.min(.5,c.l))<.36}};

function sorted(){
  let list=recs.filter(r=>!query||(r.artist+' '+r.title).toLowerCase().includes(query));
  const by={
    artist:(a,b)=>a.artist.localeCompare(b.artist),
    year:(a,b)=>(a.year||9999)-(b.year||9999),
    added:(a,b)=>new Date(b.added)-new Date(a.added),
    color:(a,b)=>key(a)-key(b),
  };
  const key=r=>{const c=colors.get(r);if(!c)return 999;return c.s<.14?500+c.l*100:c.h};   // greys go last, by lightness
  return list.sort(by[sort]);
}

function render(){
  const list=sorted(),box=$('shelves');
  const per=Math.max(4,Math.floor((box.clientWidth-40)/38));
  box.innerHTML='';
  for(let i=0;i<list.length;i+=per){
    const row=document.createElement('div');row.className='row';
    list.slice(i,i+per).forEach(r=>{
      const {w,h}=dims(r),c=spineColor(r);
      const b=document.createElement('button');b.className='spine';b.title=`${r.artist} — ${r.title}`;
      b.style.cssText=`--w:${w}px;--h:${h}px;--c:${c.bg};--fg:${c.dark?'#F6EEDC':'#1a140c'}`;
      b.innerHTML=`<b>${esc(r.title)}</b><span>${esc(r.artist)}</span><em>${esc(r.year||'')}</em>`;
      b.addEventListener('click',()=>openRecord(r));
      row.appendChild(b);
    });
    box.append(row,Object.assign(document.createElement('div'),{className:'board'}));
  }
  if(!list.length)box.innerHTML='<p style="opacity:.6;padding:40px 14px">Nothing on the shelf matches.</p>';
}

function openRecord(r){
  $('card').innerHTML=`
    <button class="close" aria-label="Close">✕</button>
    <div class="sleeve"><div class="disc"></div><div class="face cv"></div></div>
    <div class="txt"><h2>${esc(r.title)}</h2><p>${esc(r.artist)}</p>
      ${[...r.genres,...r.styles].map(g=>`<span class="tag">${esc(g)}</span>`).join('')}
      <div class="m">${esc(r.year||'—')} · ${esc(r.label||'—')}</div></div>`;
  const f=$('card').querySelector('.face');f.style.backgroundImage=coverBg(r);f.insertAdjacentHTML('beforeend',coverText(r));
  $('pull').classList.add('open');
}
const closeRecord=()=>$('pull').classList.remove('open');
$('pull').addEventListener('click',e=>{if(!e.target.closest('.sleeve,.txt')||e.target.closest('.close'))closeRecord()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeRecord()});

$('ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sort=b.dataset.s;document.querySelectorAll('#ctl button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});

loadRecords().then(async({recs:R,source})=>{
  recs=R;$('src').textContent=`${recs.length} records · ${source}`;
  render();
  // sample cover colours in the background, tint spines as they arrive
  let done=0,real=0;
  await eachLimit(recs,6,async r=>{const c=await dominant(r);colors.set(r,c);if(c.real)real++;done++;$('colorBtn').textContent=done<recs.length?`Colour ${Math.round(done/recs.length*100)}%`:'Colour'});
  $('src').textContent+=real<recs.length/2?' · cover colours estimated (image host blocks pixel reads)':' · spine colours from cover art';
  render();
});
</script>
</body>
</html>
