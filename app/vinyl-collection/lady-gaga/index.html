<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Gaga — Bruno's Collection</title>
<link rel="icon" href="../../assets/favicon.ico">
<link rel="preload" href="../fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <a class="back" href="../">← The Collection</a>
      <div class="display">Lady Gaga</div>
      <p>Every CD and vinyl in Bruno's collection, era by era.</p>
    </div>
    <svg id="disc" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="#0B0A08" stroke="#3a352c" stroke-width="1"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#2a2620" stroke-width="0.6"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2a2620" stroke-width="0.6"/>
      <circle cx="50" cy="50" r="34" fill="none" stroke="#2a2620" stroke-width="0.6"/>
      <circle cx="50" cy="50" r="28" fill="none" stroke="#2a2620" stroke-width="0.6"/>
      <circle cx="50" cy="50" r="16" fill="#C99A2E"/>
      <circle cx="50" cy="50" r="3" fill="#0B0A08"/>
    </svg>
  </div>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Search by title or edition…" aria-label="Search Lady Gaga records">
  <div class="seg" id="formatFilter" role="group" aria-label="Format">
    <button type="button" data-format="all" aria-pressed="true">All</button>
    <button type="button" data-format="vinyl" aria-pressed="false">Vinyl</button>
    <button type="button" data-format="cd" aria-pressed="false">CD</button>
  </div>
  <button class="ghost" id="refresh">Refresh from Discogs</button>
  <span class="meta" id="countMeta"></span>
</div>

<nav class="era-nav" id="eraNav" aria-label="Eras" hidden></nav>

<main>
  <div id="content">
    <div class="skeleton-grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
</main>

<footer>Data via the <a href="https://www.discogs.com" target="_blank" rel="noopener">Discogs</a> API</footer>

<script src="script.js"></script>

</body>
</html>
