<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype 2 — Turntable</title>
<style>
@font-face{font-family:'Fraunces';src:url('../fonts/fraunces-latin.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Space Grotesk';src:url('../fonts/space-grotesk-latin.woff2') format('woff2');font-weight:400 600;font-display:swap}

:root{--ink:#17140F;--paper:#F2EAD8;--gold:#C99A2E;--d:min(440px,90vw)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,#2b2116 0,#0f0c08 70%);color:var(--paper);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}

.protonav{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:999;display:flex;gap:2px;background:rgba(20,17,13,.85);backdrop-filter:blur(8px);border:1px solid rgba(242,234,216,.2);border-radius:99px;padding:4px;font:500 12px 'Space Grotesk',sans-serif;white-space:nowrap}
.protonav a{color:#F2EAD8;text-decoration:none;padding:6px 11px;border-radius:99px;opacity:.7}
.protonav a[aria-current]{background:#C99A2E;color:#17140F;opacity:1}

main{max-width:1000px;margin:0 auto;padding:70px 20px 40px;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr;justify-items:center}}

/* ---------- the deck ---------- */
.deck{position:relative;width:var(--d);height:var(--d);border-radius:14px;
  background:repeating-linear-gradient(92deg,#3a2616 0 3px,#33210f 3px 6px),#33210f;background-blend-mode:multiply;
  box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,220,170,.2),inset 0 0 0 6px #22160b}
.platter{position:absolute;left:7.14%;top:9.5%;width:85.7%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2b2b2b,#141414);box-shadow:0 0 0 4px #555,0 0 0 6px #222,0 8px 20px rgba(0,0,0,.6)}
.vinyl{position:absolute;inset:3%;border-radius:50%;cursor:pointer;
  background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1a1a1a 2px 3px);animation:spin 1.8s linear infinite;animation-play-state:paused}
.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl.swap{animation:drop .6s cubic-bezier(.3,1.4,.5,1),spin 1.8s linear infinite;animation-play-state:running,paused}
.playing .vinyl.swap{animation-play-state:running,running}
@keyframes drop{from{transform:translateY(-40px) scale(1.15);opacity:0}to{transform:none;opacity:1}}
.label{position:absolute;left:32%;top:32%;width:36%;height:36%;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 3px #0c0c0c}
.label i{position:absolute;left:50%;top:50%;width:9%;height:9%;transform:translate(-50%,-50%);border-radius:50%;background:#0b0a08;box-shadow:0 0 0 2px #888}
.sheen{position:absolute;inset:3%;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,transparent 0 18%,rgba(255,255,255,.11) 25%,transparent 32% 68%,rgba(255,255,255,.11) 75%,transparent 82%)}
.pivot{position:absolute;left:88%;top:14%;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ddd,#666 60%,#333);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.arm{position:absolute;left:88%;top:14%;width:1.6%;margin-left:-.8%;height:62%;background:linear-gradient(90deg,#999,#eee,#888);border-radius:3px;transform-origin:50% 0;transform:rotate(-8deg);cursor:pointer;filter:drop-shadow(3px 6px 4px rgba(0,0,0,.5))}
.arm .head{position:absolute;bottom:-3%;left:-90%;width:280%;height:9%;background:linear-gradient(#333,#111);border-radius:2px}
.arm::before{content:"";position:absolute;left:-60%;top:-4%;width:220%;height:12%;border-radius:4px;background:#bbb}
.knob{position:absolute;left:5%;bottom:4%;padding:8px 14px;border-radius:99px;border:0;background:var(--gold);color:var(--ink);font:600 12px 'Space Grotesk',sans-serif;cursor:pointer;z-index:2}
.speed{position:absolute;right:5%;bottom:5%;font:600 11px 'Space Grotesk',sans-serif;letter-spacing:.1em;opacity:.55}
.led{position:absolute;right:16%;bottom:5.6%;width:8px;height:8px;border-radius:50%;background:#4a1d17;transition:.3s}
.playing .led{background:#ff5b3d;box-shadow:0 0 10px #ff5b3d}

/* ---------- right column ---------- */
.info h1{font:600 clamp(28px,4vw,42px)/1.05 'Fraunces',serif;margin:0 0 6px;letter-spacing:-.01em}
.info .artist{font-size:18px;opacity:.75;margin-bottom:14px}
.tag{display:inline-block;border:1px solid rgba(242,234,216,.3);border-radius:99px;padding:3px 10px;font-size:11px;margin:0 4px 4px 0}
.meta{margin:12px 0 18px;font-size:13px;opacity:.6}
.listen{display:inline-block;margin-bottom:14px;color:var(--gold);font-size:13px}
ol.tracks{list-style:none;margin:0;padding:0;border-top:1px solid rgba(242,234,216,.15)}
ol.tracks li{display:flex;gap:12px;padding:9px 6px;border-bottom:1px solid rgba(242,234,216,.1);font-size:14px;transition:.3s}
ol.tracks .pos{width:28px;opacity:.45;font-variant-numeric:tabular-nums}
ol.tracks .t{flex:1}
ol.tracks .dur{opacity:.5;font-variant-numeric:tabular-nums}
ol.tracks li.now{background:rgba(201,154,46,.16);color:#fff;padding-left:14px;box-shadow:inset 3px 0 0 var(--gold)}
.note{opacity:.5;font-size:13px;padding:10px 0}

/* ---------- record strip ---------- */
.strip{grid-column:1/-1;width:100%;display:flex;gap:10px;overflow-x:auto;padding:14px 4px 10px;scroll-snap-type:x proximity;border-top:1px solid rgba(242,234,216,.12);margin-top:6px}
.strip button{flex:none;width:76px;height:76px;border:0;padding:0;border-radius:3px;cursor:pointer;background-size:cover;background-position:center;opacity:.55;transition:.2s;scroll-snap-align:center;position:relative}
.strip button:hover{opacity:1;transform:translateY(-4px)}
.strip button.on{opacity:1;box-shadow:0 0 0 2px var(--gold);transform:translateY(-6px)}
.strip .ctext{display:none}
.cv{background-size:cover;background-position:center}
@media (prefers-reduced-motion:reduce){.vinyl,.vinyl.swap{animation:none}}
</style>
</head>
<body>
<nav class="protonav">
  <a href="1-crate.html">1 Crate</a><a href="2-turntable.html" aria-current="page">2 Deck</a><a href="3-shelf.html">3 Shelf</a><a href="4-map.html">4 Map</a><a href="5-stats.html">5 Stats</a>
</nav>

<main>
  <div class="deck" id="deck">
    <div class="platter">
      <div class="vinyl" id="vinyl"><div class="label" id="label"><i></i></div></div>
      <div class="sheen"></div>
    </div>
    <div class="pivot"></div>
    <div class="arm" id="arm" title="Click to drop / lift the needle"><div class="head"></div></div>
    <button class="knob" id="playBtn">Drop the needle</button>
    <span class="led"></span><span class="speed">33⅓</span>
  </div>

  <section class="info" id="info"><div class="note">Loading…</div></section>

  <div class="strip" id="strip" aria-label="Pick a record"></div>
</main>

<script>
/* ---- shared data loader (same source as the real app) ---- */
const CACHE_KEY='vinyl_collection_cache_v2';
const SAMPLE=[
['Pink Floyd','The Dark Side of the Moon',1973,'Rock','Prog Rock','Harvest'],['Miles Davis','Kind of Blue',1959,'Jazz','Modal','Columbia'],
['Fleetwood Mac','Rumours',1977,'Rock','Soft Rock','Warner Bros.'],['Daft Punk','Random Access Memories',2013,'Electronic','Disco','Columbia'],
['Stevie Wonder','Songs in the Key of Life',1976,'Funk / Soul','Soul','Tamla'],['Radiohead','OK Computer',1997,'Rock','Alternative Rock','Parlophone'],
['Nirvana','Nevermind',1991,'Rock','Grunge','DGC'],['Massive Attack','Mezzanine',1998,'Electronic','Trip Hop','Virgin'],
['John Coltrane','A Love Supreme',1965,'Jazz','Free Jazz','Impulse!'],['Portishead','Dummy',1994,'Electronic','Trip Hop','Go! Discs'],
['David Bowie','Low',1977,'Rock','Art Rock','RCA'],['Kendrick Lamar','To Pimp a Butterfly',2015,'Hip Hop','Conscious','Interscope'],
['Talking Heads','Remain in Light',1980,'Rock','New Wave','Sire'],['Joni Mitchell','Blue',1971,'Folk','Singer-Songwriter','Reprise'],
['Aphex Twin','Selected Ambient Works 85-92',1992,'Electronic','Ambient','R&S'],['The Beatles','Abbey Road',1969,'Rock','Pop Rock','Apple'],
['Herbie Hancock','Head Hunters',1973,'Jazz','Jazz-Funk','Columbia'],['Amy Winehouse','Back to Black',2006,'Funk / Soul','Soul','Island'],
['Kraftwerk','Trans-Europe Express',1977,'Electronic','Synth-pop','Kling Klang'],['Nina Simone','Pastel Blues',1965,'Jazz','Vocal','Philips'],
['Tame Impala','Currents',2015,'Rock','Psychedelic Rock','Modular'],['Lady Gaga','The Fame',2008,'Pop','Synth-pop','Interscope'],
['Björk','Homogenic',1997,'Electronic','Art Pop','One Little Indian'],['Led Zeppelin','IV',1971,'Rock','Hard Rock','Atlantic'],
['Frank Ocean','Blonde',2016,'Funk / Soul','Contemporary R&B',"Boys Don't Cry"],['Boards of Canada','Music Has the Right to Children',1998,'Electronic','IDM','Warp'],
['Bob Marley & The Wailers','Exodus',1977,'Reggae','Roots Reggae','Island'],['Beach House','Depression Cherry',2015,'Rock','Dream Pop','Sub Pop'],
['A Tribe Called Quest','The Low End Theory',1991,'Hip Hop','Jazzy Hip-Hop','Jive'],['Fela Kuti','Zombie',1977,'Funk / Soul','Afrobeat','Coconut'],
['The Cure','Disintegration',1989,'Rock','Goth Rock','Fiction'],['Caribou','Swim',2010,'Electronic','House','City Slang'],
];
const isVinyl=r=>(r.basic_information.formats||[]).some(f=>f.name==='Vinyl');
function norm(r){const b=r.basic_information;return{id:r.id,title:b.title,artist:(b.artists||[]).map(a=>a.name.replace(/\s\(\d+\)$/,'')).join(', ')||'Unknown',year:b.year||0,cover:b.cover_image||b.thumb||'',thumb:b.thumb||b.cover_image||'',genres:b.genres||[],styles:b.styles||[],label:((b.labels||[])[0]||{}).name||'',added:r.date_added||''}}
async function loadRecords(){
  try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c&&c.data&&c.data.length)return{recs:c.data.filter(isVinyl).map(norm),source:'your cached collection'}}catch(e){}
  try{const res=await fetch('https://api.discogs.com/users/brunovidasi/collection/folders/0/releases?per_page=100');if(res.ok){const d=await res.json();const v=(d.releases||[]).filter(isVinyl);if(v.length)return{recs:v.map(norm),source:'Discogs (first 100 records)'}}}catch(e){}
  return{recs:SAMPLE.map((s,i)=>({id:-i-1,artist:s[0],title:s[1],year:s[2],genres:[s[3]],styles:[s[4]],label:s[5],cover:'',thumb:'',added:new Date(2018+(i*7)%8,(i*5)%12,1+i%27).toISOString()})),source:'sample data (Discogs unreachable)'}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const fallbackBg=r=>{const h=hash(r.artist+r.title)%360;return `linear-gradient(135deg,hsl(${h} 45% 38%),hsl(${(h+40)%360} 50% 18%))`};
const coverBg=(r,thumb)=>{const u=thumb?r.thumb:r.cover;return u?`url("${u.replace(/"/g,'%22')}"),${fallbackBg(r)}`:fallbackBg(r)};
/* ---- end shared ---- */

const $=id=>document.getElementById(id);
const REST=-8,START=14,END=29;   // tonearm angles: parked, outer groove, inner groove
let recs=[],cur=null,playing=false,armT=0,tickT=0,elapsed=0,tracks=[];

function setArm(deg,ms,ease='cubic-bezier(.3,.7,.3,1)'){const a=$('arm');a.style.transition=`transform ${ms}ms ${ease}`;a.style.transform=`rotate(${deg}deg)`}
const secs=d=>{const p=String(d||'').split(':').map(Number);return !d||p.some(isNaN)?0:p.reduce((a,n)=>a*60+n,0)};   // "3:45" -> 225
const total=()=>Math.max(60,tracks.reduce((s,t)=>s+(secs(t.duration)||210),0)||1500);

function play(){
  if(playing)return;playing=true;
  $('deck').classList.add('playing');$('playBtn').textContent='Lift the needle';
  setArm(START,900);clearTimeout(armT);
  armT=setTimeout(()=>{if(playing)setArm(END,total()*1000,'linear')},950);   // the arm creeps inward over the record's real length
  elapsed=0;clearInterval(tickT);tickT=setInterval(()=>{elapsed++;markTrack()},1000);markTrack();
}
function stop(){
  playing=false;$('deck').classList.remove('playing');$('playBtn').textContent='Drop the needle';
  setArm(REST,900);clearTimeout(armT);clearInterval(tickT);
  document.querySelectorAll('ol.tracks li.now').forEach(li=>li.classList.remove('now'));
}
function markTrack(){
  const lis=[...document.querySelectorAll('ol.tracks li[data-t]')];if(!lis.length)return;
  let acc=0,idx=lis.length-1;
  for(let i=0;i<lis.length;i++){acc+=secs(tracks[i].duration)||210;if(elapsed<acc){idx=i;break}}
  if(elapsed>=total()){stop();return}
  lis.forEach((li,i)=>li.classList.toggle('now',i===idx));
}
const toggle=()=>playing?stop():play();
$('playBtn').addEventListener('click',toggle);$('arm').addEventListener('click',toggle);$('vinyl').addEventListener('click',toggle);

function renderInfo(r,extra){
  $('info').innerHTML=`
    <h1>${esc(r.title)}</h1><div class="artist">${esc(r.artist)}</div>
    ${[...r.genres,...r.styles].map(g=>`<span class="tag">${esc(g)}</span>`).join('')}
    <div class="meta">${esc(r.year||'—')} · ${esc(r.label||'—')}</div>
    ${extra||''}`;
}
function renderTracks(r,list,note,video){
  const link=video?`<a class="listen" href="${esc(video.uri)}" target="_blank" rel="noopener">▶ Listen on YouTube — ${esc(video.title)}</a>`:'';
  const body=list&&list.length
    ?`<ol class="tracks">${list.map(t=>`<li data-t><span class="pos">${esc(t.position)}</span><span class="t">${esc(t.title)}</span><span class="dur">${esc(t.duration)}</span></li>`).join('')}</ol>`
    :`<div class="note">${esc(note||'')}</div>`;
  renderInfo(r,link+body);
}
async function loadDetails(r){
  tracks=[];renderTracks(r,null,'Loading tracklist from Discogs…');
  if(r.id<0){renderTracks(r,null,'Sample record — the real tracklist appears when Discogs is reachable.');return}
  try{
    const res=await fetch(`https://api.discogs.com/releases/${r.id}`);if(!res.ok)throw new Error(res.status);
    const f=await res.json();if(cur!==r)return;
    tracks=(f.tracklist||[]).filter(t=>t.type_==='track'||!t.type_);
    const v=(f.videos||[]).find(v=>/^https?:/.test(v.uri||''));
    renderTracks(r,tracks,'No tracklist on Discogs for this release.',v);
  }catch(e){if(cur===r)renderTracks(r,null,"Couldn't load the tracklist (Discogs rate limit or offline).")}
}

function select(i,autoplay){
  const r=recs[i];if(!r)return;
  stop();cur=r;
  const v=$('vinyl');v.classList.remove('swap');void v.offsetWidth;v.classList.add('swap');
  $('label').style.backgroundImage=coverBg(r);
  document.querySelectorAll('#strip button').forEach((b,k)=>b.classList.toggle('on',k===i));
  const on=document.querySelector('#strip button.on'),st=$('strip');if(on)st.scrollTo({left:on.offsetLeft-st.clientWidth/2+on.offsetWidth/2,behavior:'smooth'});
  loadDetails(r);
  if(autoplay)setTimeout(()=>{if(cur===r)play()},1000);
}

loadRecords().then(({recs:R})=>{
  recs=R.sort((a,b)=>a.artist.localeCompare(b.artist));
  const strip=$('strip');
  recs.forEach((r,i)=>{const b=document.createElement('button');b.title=`${r.artist} — ${r.title}`;b.style.backgroundImage=coverBg(r,true);b.addEventListener('click',()=>select(i,true));strip.appendChild(b)});
  select(0,false);
});
</script>
</body>
</html>
