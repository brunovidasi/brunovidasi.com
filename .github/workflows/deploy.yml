name: Deploy to Server via FTP

on:
  push:
    branches:
      - main
  # Daily redeploy so json/github.json (repos, stars, contributions) stays fresh.
  # Only the changed file is uploaded.
  schedule:
    - cron: '0 18 * * *'   # 04:00/05:00 Sydney time
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GH_STATS_TOKEN is a fine-grained personal access token (public repos,
      # read-only). Falls back to the workflow's own token if it isn't set.
      # A failure here shouldn't block a deploy: the panel then falls back to
      # the public REST API in the browser.
      - name: Snapshot GitHub profile
        continue-on-error: true
        run: node scripts/fetch-github.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /domains/brunovidasi.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            scripts/**
